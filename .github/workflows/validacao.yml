name: Validação da ASTOM Platform

on:
  push:
    paths:
      - 'core/**'
      - 'profiles/**'
      - 'tests/**'
      - '.github/workflows/validacao.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'profiles/**'
      - 'tests/**'
      - '.github/workflows/validacao.yml'

permissions:
  contents: read

jobs:
  validacao:
    name: Diagnóstico, planejamento e perfis somente leitura
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validar sintaxe Bash
        run: |
          bash -n core/astom-diagnostico.sh
          bash -n tests/teste-diagnostico.sh
          bash -n tests/teste-planejamento.sh
          bash -n tests/teste-perfil-referencia.sh
          bash -n tests/teste-preflight-recuperacao.sh

      - name: Executar ShellCheck
        run: |
          shellcheck --severity=error \
            core/astom-diagnostico.sh \
            tests/teste-diagnostico.sh \
            tests/teste-planejamento.sh \
            tests/teste-perfil-referencia.sh \
            tests/teste-preflight-recuperacao.sh

      - name: Validar sintaxe Python
        run: |
          python3 -m py_compile core/astom-planejar.py
          python3 -m py_compile core/astom-preflight-recuperacao.py

      - name: Executar testes do diagnóstico
        run: bash tests/teste-diagnostico.sh

      - name: Executar testes do planejamento
        run: bash tests/teste-planejamento.sh

      - name: Executar testes do perfil de referência
        run: bash tests/teste-perfil-referencia.sh

      - name: Executar pré-flight de recuperação
        run: bash tests/teste-preflight-recuperacao.sh
